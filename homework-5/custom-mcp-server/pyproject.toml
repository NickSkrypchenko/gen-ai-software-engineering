[project]
name = "lorem-ipsum-mcp"
version = "0.1.0"
description = "Custom FastMCP server returning first N words of lorem-ipsum.md"
requires-python = ">=3.11"
dependencies = ["fastmcp>=0.4.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
